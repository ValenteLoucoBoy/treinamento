<!DOCTYPE html>
<html>
<head>
    <title>Detector de Objetos com Teachable Machine (Completo)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/tm-image.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #webcam-container {
            margin: 20px auto;
            width: 320px; /* Largura padrão */
            height: 240px; /* Altura padrão */
            border: 1px solid #ccc;
            /* Garante que o canvas da webcam se ajuste ao container */
        }
        #label-container {
            margin-top: 20px;
            font-size: 1.2em;
        }
        /* Estilo para garantir que o canvas preencha o container */
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>Protótipo de Detecção de Objetos com Câmera</h1>
    <p>Clique em "Iniciar" para carregar o modelo e ligar a câmera.</p>

    <button type="button" onclick="init()">Iniciar Detecção</button>
    
    <div id="webcam-container">
        </div>
    
    <div id="label-container">
        </div>

    <script type="text/javascript">
        // 1. IMPORTANTE: SUBSTITUA ESTA URL PELO LINK DO SEU PRÓPRIO MODELO TEACHABLE MACHINE
        const URL = "https://teachablemachine.withgoogle.com/models/SUA_ID_AQUI/";

        let model, webcam, labelContainer, maxPredictions;

        // Função de inicialização
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Carrega o modelo e metadados
            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
            } catch (e) {
                alert("Erro ao carregar o modelo. Verifique se a URL está correta e tente novamente.");
                console.error(e);
                return;
            }

            // 2. CONFIGURAÇÃO DA CÂMERA (AQUI ESTÁ A ALTERAÇÃO)
            // Você pode mudar o valor 'size' para alterar a resolução/tamanho de captura.
            // Para manter a proporção e o desempenho, use valores iguais (ex: 200, 200).
            const size = 320; 
            
            // Define se a imagem da câmera deve ser espelhada (Útil para câmeras frontais)
            const flip = true; 

            // Cria o objeto da webcam com as configurações
            webcam = new tmImage.Webcam(size, size, flip); 
            
            try {
                await webcam.setup(); // Solicita e configura o acesso à câmera
                await webcam.play(); // Inicia o streaming da câmera
            } catch (e) {
                alert("Erro ao acessar a câmera. Verifique as permissões do navegador.");
                console.error(e);
                return;
            }
            
            // Insere o canvas da webcam no container HTML
            document.getElementById("webcam-container").innerHTML = ''; // Limpa o container antes de adicionar
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            // Configura o container de labels (resultados)
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            // Inicia o loop de predição
            window.requestAnimationFrame(loop);
            
            console.log("Modelo carregado e câmera iniciada.");
        }

        // Loop principal: executa a predição em cada frame
        function loop() {
            webcam.update(); // Atualiza a imagem da webcam
            predict();
            window.requestAnimationFrame(loop);
        }

        // Função de predição
        async function predict() {
            // Obtém a predição (o modelo usa o canvas da webcam)
            const prediction = await model.predict(webcam.canvas);
            
            // Atualiza os resultados na tela
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction = prediction[i].className + 
                    ": " + prediction[i].probability.toFixed(2); // Formata para 2 casas decimais
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>

</body>
</html>
